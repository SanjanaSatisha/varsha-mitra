# Render Blueprint - lets Render auto-configure the service from this file
# (Dashboard > New > Blueprint > point at this repo)
services:
  - type: web
    name: varsha-mitra
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 3000
